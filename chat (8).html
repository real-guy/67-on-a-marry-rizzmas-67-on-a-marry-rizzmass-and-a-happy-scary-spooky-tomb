<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --red: #ff0000;
    --red-dark: #b30000;
    --bg: #000;
    --font: 'Lexend', sans-serif;
    --sidebar-width: 190px;
  }
 
  html {
    width: 100%;
    background: var(--bg);
  }

  body {
    width: 100%;
    margin: 0;
    background: var(--bg);
    font-family: var(--font);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .global-top-divider {
    border: none;
    height: 2px;
    background-color: var(--red);
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
  }

  .app-container {
    display: flex;
    width: 100%;
    padding-top: 2px;
    min-height: 100vh;
  }

  .sidebar {
    width: var(--sidebar-width);
    height: calc(100vh - 2px);
    position: fixed;
    top: 2px; left: 0;
    background: #080000;
    border-right: 2px solid var(--red);
    display: flex;
    flex-direction: column;
    z-index: 100;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 18px 14px 12px;
    border-bottom: 2px solid #2a0000;
  }
  .sidebar-header h2 {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--red);
    text-transform: uppercase;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 6px;
  }

  .nav-item {
    background: #110000;
    border: 1px solid #330000;
    color: #ccc;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    text-decoration: none;
    display: block;
    width: 100%;
    box-sizing: border-box;
  }
  a.nav-item {
    text-decoration: none;
    color: #ccc;
  }
  a.nav-item:visited {
    color: #ccc;
  }
  .nav-item:hover, .nav-item.active,
  a.nav-item:hover, a.nav-item.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 0;
    min-width: 0;
    position: relative;
    z-index: 1;
    overflow: visible;
    box-sizing: border-box;
    width: 100%;
  }

  .page {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;

  function hasBadWords(text) {

      var parts = raw.split(/[^a-z]+/);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];

        if (BAD_HASH[window.__eagnoaSha256(p)]) return true;

  function flashStatus(msg, color) {
    var prev = statusEl.textContent;

    statusEl.textContent = msg;
    statusEl.style.color = color || "#f66";
    setTimeout(function() {
      statusEl.textContent = prev;

  form.addEventListener("submit", function(ev) {
    ev.preventDefault();
    var text = (input.value || "").trim();
    if (!text) return;
    if (hasBadWords(text) || hasBadWords(safeName())) {
      flashStatus("Message blocked", "#f66");

    saveNick();
    var id = String(Date.now()) + "_" + Math.random().toString(36).slice(2, 8);

      m: text.slice(0, 400),
      t: Date.now()

      console.error(e);
      flashStatus("Send failed", "#f66");
    }
    input.value = "";
    input.focus();
  });
