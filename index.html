<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  :root {
    --red: #ff0000;
    --red-dark: #b30000;
    --bg: #000;
    --font: 'Lexend', sans-serif;
    --sidebar-width: 190px;
  }
 
  html {
    width: 100%;
    background: var(--bg);
  }

  body {
    width: 100%;
    margin: 0;
    background: var(--bg);
    font-family: var(--font);
    color: #fff;
    overflow-x: hidden;
    min-height: 100vh;
  }

  .global-top-divider {
    border: none;
    height: 2px;
    background-color: var(--red);
    width: 100%;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
  }

  .app-container {
    display: flex;
    width: 100%;
    padding-top: 2px;
    min-height: 100vh;
  }

  .sidebar {
    width: var(--sidebar-width);
    height: calc(100vh - 2px);
    position: fixed;
    top: 2px; left: 0;
    background: #080000;
    border-right: 2px solid var(--red);
    display: flex;
    flex-direction: column;
    z-index: 100;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 18px 14px 12px;
    border-bottom: 2px solid #2a0000;
  }
  .sidebar-header h2 {
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--red);
    text-transform: uppercase;
  }

  .sidebar-nav {
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 6px;
  }

  .nav-item {
    background: #110000;
    border: 1px solid #330000;
    color: #ccc;
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s ease;
    text-decoration: none;
    display: block;
    width: 100%;
    box-sizing: border-box;
  }
  a.nav-item {
    text-decoration: none;
    color: #ccc;
  }
  a.nav-item:visited {
    color: #ccc;
  }
  .nav-item:hover, .nav-item.active,
  a.nav-item:hover, a.nav-item.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .main-content {
    margin-left: var(--sidebar-width);
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 0;
    min-width: 0;
    position: relative;
    z-index: 1;
    overflow: visible;
    box-sizing: border-box;
    width: 100%;
  }

  .page {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    min-width: 0;
    position: relative;
    z-index: 1;
  }

  
  #page-launcher {
    min-height: 0;
    justify-content: flex-start;
    padding-bottom: 12px;
    padding-top: 0;
    position: relative;
    top: 0;
    gap: 20px;
    max-width: none;
    width: 100%;
    align-self: stretch;
  }
  #page-launcher .launcher-video-wrap {
    width: 100%;
    max-width: none;
    align-self: stretch;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    flex-shrink: 0;
    margin-left: 0;
    margin-right: 0;
  }
  #page-launcher .launcher-video {
    width: 100%;
    max-width: none;
    height: 280px;
    object-fit: cover;
    background: #000;
    border-radius: 10px;
    border: 1px solid #3a0000;
    display: block;
  }
  #page-launcher .launcher-video-divider {
    width: 100%;
    height: 2px;
    background: var(--red);
    margin: 16px 0 8px;
    border: none;
  }
  #page-launcher .launcher-controls {
    overflow: visible;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: auto;
    margin-bottom: auto;
    padding-top: 6px;
    padding-bottom: 24px;
  }
  #page-launcher .select-heading {
    margin-top: 0;
    margin-bottom: 0;
  }
  #page-launcher .select-row {
    margin-top: 0;
    margin-bottom: 0;
  }
  #page-launcher .action-btns {
    margin-bottom: 0;

    display: flex;
    animation: fadeIn 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .select-heading h1 { font-size: 22px; font-weight: 900; letter-spacing: 0.04em; color: #fff; margin-bottom: 4px; }
  .select-heading p  { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; opacity: 0.75; }

  .select-row {
    position: relative;
    width: 100%;
    max-width: 680px;
  }

  .pill-wrap { width: 100%; position: relative; }

  .pill-trigger {
    width: 100%;
    background: var(--red);
    border: none;
    border-radius: 999px;
    padding: 12px 20px;
    font-family: var(--font);
    font-size: 15px; font-weight: 700; color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    transition: background 0.2s cubic-bezier(0.25, 1, 0.5, 1), border-radius 0.2s cubic-bezier(0.25, 1, 0.5, 1), transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
    outline: none;
  }

  .pill-trigger:hover { background: #e50000; transform: translateY(-1px); }
  .pill-trigger.open  { border-radius: 16px 16px 0 0; background: var(--red-dark); transform: none; }

  .pill-label { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.8; transition: opacity 0.2s ease; }
  .pill-label.chosen { opacity: 1; }

  .pill-chevron { width: 18px; height: 18px; flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1); }
  .pill-trigger.open .pill-chevron { transform: rotate(180deg); }

  .drop-menu {
    display: none;
    position: absolute;
    top: 100%; left: 0; right: 0;
    background: #130000;
    border: 1px solid #3a0000;
    border-top: none;
    border-radius: 0 0 16px 16px;
    max-height: 320px;
    overflow-y: auto;
    z-index: 200;
  }

  .drop-menu.open {
    display: block;
    animation: menuSlideIn 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }

  .drop-menu::-webkit-scrollbar { width: 4px; }
  .drop-menu::-webkit-scrollbar-thumb { background: #3a0000; border-radius: 2px; }
  .search-wrap {
    position: sticky;
    top: 0;
    background: #130000;
    padding: 8px 12px;
    border-bottom: 1px solid #3a0000;
    z-index: 10;
  }
  .search-input {
    width: 100%;
    background: #080000;
    border: 1px solid #4a0000;
    border-radius: 999px;
    padding: 6px 14px;
    font-family: var(--font);
    font-size: 13px;
    color: #fff;
    outline: none;
    transition: border-color 0.2s ease;
  }
  .search-input:focus {
    border-color: var(--red);
  }

  .group-hdr {
    padding: 8px 16px 2px;
    font-size: 8px; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase;
    color: #fff; border-top: 1px solid #1e0000;
    max-height: 30px;
    opacity: 1;
    overflow: hidden;
    transition: max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                padding 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                opacity 0.4s ease,
                border-top-color 0.45s ease;
  }
  .group-hdr:first-child { border-top: none; }

  .drop-item {
    padding: 9px 16px;
    font-size: 13px; font-weight: 700; color: #fff;
    cursor: pointer; display: flex; align-items: center; gap: 8px;
    max-height: 40px;
    opacity: 1;
    overflow: hidden;
    transition: background 0.15s ease,
                color 0.15s ease,
                max-height 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                padding 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                opacity 0.35s ease;
  }
  .drop-item:hover { background: #1a0000; color: #fff; }
  .drop-item:last-child { border-radius: 0 0 16px 16px; }
  .group-hdr.search-hidden {
    max-height: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    opacity: 0 !important;
    border-top-color: transparent !important;
  }
  .drop-item.search-hidden {
    max-height: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    opacity: 0 !important;

  a.launch-pill,
  a.launch-pill:link,
  a.launch-pill:visited,
  a.launch-pill:hover,
  a.launch-pill:focus,

    background: #0d0000 !important;

    border-radius: 999px !important;
    color: #444 !important;
    cursor: default !important;
    font-family: var(--font) !important;
    font-size: 12px !important;
    font-weight: 900 !important;
    letter-spacing: 0.04em !important;

  a.launch-pill.activated,

    border-color: #330000 !important;
    color: #bbb !important;
    cursor: pointer !important;
  }
  a.launch-pill.activated:hover,

    background: #ff0000 !important;
    border-color: #ff0000 !important;
    color: #fff !important;
  }

    background: #0d0000;
    border: 2px solid #1c1c1c;
    border-radius: 999px;
    padding: 7px 18px;
    font-family: var(--font);
    font-size: 12px; font-weight: 900; color: #444;

  .dl-pill.activated {
    border-color: #333;
    color: #bbb;

    color: #fff;

    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn { 
    from { opacity: 0; transform: translateY(-4px); } 
    to { opacity: 1; transform: translateY(0); } 
  }

const BADGE_CFG = {
  wisp: { cls:"badge-wisp", label:"Wisp" },
  wasm: { cls:"badge-wasm", label:"WASM" },
  javs: { cls:"badge-javs", label:"JAVS" },
};
const ORDER = ["Modern","Legacy","Beta","Alpha","Infdev & Indev","Classic","Pre-Classic","Misc."];

const pillTrigger = document.getElementById("pillTrigger");
const pillLabel   = document.getElementById("pillLabel");
const dropMenu    = document.getElementById("dropMenu");
const newTabBtn   = document.getElementById("newTabBtn");

function updatePlayHref() {
  if (newTabBtn) {
    newTabBtn.style.textDecoration = "none";
    newTabBtn.style.borderBottom = "none";
  }

  if (!selected || !newTabBtn) return;
  const encoded = selected.file.split("/").map(encodeURIComponent).join("/");
  newTabBtn.setAttribute("href", "https://eaglercraftnoa.github.io/version/" + encoded);
}

const dlBtn       = document.getElementById("dlBtn");
const menuSearch  = document.getElementById("menuSearch");
const modPageSearch = document.getElementById("modPageSearch");

let menuOpen = false;
let selected = null; updatePlayHref();

const groups = {};
CATALOG.forEach(e => {
  if (!groups[e.g]) groups[e.g] = [];
  groups[e.g].push(e);
});

const renderedGroups = [];

ORDER.forEach(g => {
  if (!groups[g]) return;

  const hdr = document.createElement("div");
  hdr.className = "group-hdr";
  hdr.textContent = g;
  dropMenu.appendChild(hdr);

  const itemElements = [];

  groups[g].forEach(entry => {
    const el = document.createElement("div");
    el.className = "drop-item";
    const badges = entry.b.filter(b => BADGE_CFG[b])
      .map(b => `<span class="badge ${BADGE_CFG[b].cls}">${BADGE_CFG[b].label}</span>`).join("");
    el.innerHTML = `${badges}<span>${entry.name}</span><span class="item-sz">${entry.sz}</span>`;

    el.addEventListener("click", () => {
      selected = entry; updatePlayHref();
      pillLabel.textContent = entry.name;
      pillLabel.classList.add("chosen");

      newTabBtn.classList.add("activated");
      newTabBtn.style.color = "#bbb";
      newTabBtn.style.borderColor = "#330000";
      newTabBtn.style.cursor = "pointer";

      if (entry.dl) {
        dlBtn.classList.add("activated");
        dlBtn.classList.remove("not-downloadable");
      } else {
        dlBtn.classList.remove("activated");
        dlBtn.classList.add("not-downloadable");
      }

      closeMenu();
    });

    dropMenu.appendChild(el);
    itemElements.push({ el, name: entry.name.toLowerCase() });
  });

  renderedGroups.push({ hdr, items: itemElements });
});

function openMenu()  {
  menuOpen = true;
  dropMenu.classList.add("open");
  pillTrigger.classList.add("open");
  menuSearch.value = "";
  filterVersions("");
  setTimeout(() => menuSearch.focus(), 50);
}

function closeMenu() {
  menuOpen = false;
  dropMenu.classList.remove("open");
  pillTrigger.classList.remove("open");
}

pillTrigger.addEventListener("click", () => menuOpen ? closeMenu() : openMenu());

document.addEventListener("click", e => {
  if (!pillTrigger.contains(e.target) && !dropMenu.contains(e.target)) closeMenu();
});

function filterVersions(query) {
  renderedGroups.forEach(group => {
    let visibleCount = 0;
    group.items.forEach(item => {
      if (item.name.includes(query)) {
        item.el.classList.remove("search-hidden");
        visibleCount++;
      } else {
        item.el.classList.add("search-hidden");
      }
    });

    if (visibleCount > 0) {
      group.hdr.classList.remove("search-hidden");
    } else {
      group.hdr.classList.add("search-hidden");
    }
  });
}

menuSearch.addEventListener("input", (e) => {
  filterVersions(e.target.value.toLowerCase().trim());
});

newTabBtn.addEventListener("click", (e) => {
  if (!selected) {
    e.preventDefault();
    return;
  }
  const file = selected.file;
  const encoded = file.split("/").map(encodeURIComponent).join("/");
  const url = "https://eaglercraftnoa.github.io/version/" + encoded;
  newTabBtn.setAttribute("href", url);
  // Real <a target="_blank"> — opens in new tab (not blocked like window.open in embeds)
});

dlBtn.addEventListener("click", async () => {
  if (!selected || !selected.dl) return;
  const file = selected.file;
  const encoded = file.split("/").map(encodeURIComponent).join("/");
  const mirrors = [
    "https://cdn.jsdelivr.net/gh/real-guy/Extracters@main/" + encoded,
    "https://fastly.jsdelivr.net/gh/real-guy/Extracters@main/" + encoded,
    "https://ghproxy.net/https://raw.githubusercontent.com/real-guy/Extracters/refs/heads/main/" + encoded,
    "https://raw.githubusercontent.com/real-guy/Extracters/refs/heads/main/" + encoded
  ];
  const prev = dlBtn.textContent;
  dlBtn.textContent = "Downloading...";
  dlBtn.style.pointerEvents = "none";

  let ok = false;
  for (let i = 0; i < mirrors.length; i++) {
    try {
      const res = await fetch(mirrors[i], { mode: "cors", cache: "no-store", credentials: "omit" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const buf = await res.arrayBuffer();
      if (!buf || buf.byteLength < 100) throw new Error("Empty");
      const blob = new Blob([buf], { type: "application/octet-stream" });
      const obj = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = obj;
      a.download = file;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(obj), 5000);
      ok = true;
      break;
    } catch (err) {
      console.error(mirrors[i], err);
    }
  }
  dlBtn.textContent = ok ? "Downloaded!" : "Failed";
  setTimeout(() => {
    dlBtn.textContent = prev || "Download";
    dlBtn.style.pointerEvents = "";
  }, 2500);
});
</script>
